name: Approved one-time source transfer
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: approved-one-time-source-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'bkennedyshit/creative-claw-nebius-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TRANSFER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DESTINATION: bkennedyshit/creative-claw-nebius-2026
      SOURCE_REPOSITORY: bkennedyshit/creative-claw
      SOURCE_SHA: e68a13ca24f5de82334949861a5fe4bedc3e4316
      EXPECTED_PARENT: 7f1815abcbc4598111b8e9cf587904ea48c18889
      VERIFY_FILE: package.json
    steps:
      - name: Copy fixed source, preserve plans and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = "$DESTINATION"
          auth_header="$(printf 'x-access-token:%s' "$GH_TRANSFER_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header"
          git init destination
          cd destination
          git config core.hooksPath /dev/null
          git remote add origin "https://github.com/$DESTINATION.git"
          git fetch --depth=2 origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git checkout -B main FETCH_HEAD
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          export PRESERVED_DOCS="$RUNNER_TEMP/approved-transfer-docs"
          mkdir -p "$PRESERVED_DOCS"
          python3 - <<'PY'
          import os, pathlib, shutil
          backup = pathlib.Path(os.environ["PRESERVED_DOCS"])
          paths = [pathlib.Path("README.md"), *pathlib.Path(".").glob("HACKATHON_*.md")]
          for path in paths:
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"Unexpected planning document: {path}")
              shutil.copy2(path, backup / path.name)
          PY
          GIT_CONFIG_COUNT=0 git fetch --depth=1 "https://github.com/$SOURCE_REPOSITORY.git" "$SOURCE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git read-tree --reset -u "$SOURCE_SHA"
          git rm -r --ignore-unmatch -- .github/workflows
          python3 - <<'PY'
          import os, pathlib, re, shutil
          for path in pathlib.Path(os.environ["PRESERVED_DOCS"]).iterdir():
              shutil.copy2(path, pathlib.Path(path.name))
          p = pathlib.Path("README.md")
          text = p.read_text()
          text = re.sub(r"^> \*\*Source transfer pending:\*\*.*$", "> **Source snapshot transferred:** pinned application source is present. See [source provenance](HACKATHON_SOURCE.md). Sponsor-specific integration remains planned.", text, flags=re.M)
          p.write_text(text)
          pathlib.Path("HACKATHON_SOURCE.md").write_text(
              "# Source provenance\n\n"
              + "Copied on 2026-10-27 by the explicitly approved one-time transfer.\n\n"
              + "Source: https://github.com/" + os.environ["SOURCE_REPOSITORY"] + "\n\n"
              + "Pinned commit: `" + os.environ["SOURCE_SHA"] + "`\n\n"
              + "Destination: https://github.com/" + os.environ["DESTINATION"] + "\n\n"
              + "This is a source snapshot, not a complete history fork. Existing licenses and attribution are preserved. Preparation documents are retained. No application implementation was changed or runtime-tested by this transfer. Inherited Actions workflows and the temporary transfer workflow were omitted.\n"
          )
          p = pathlib.Path("HACKATHON_TRANSFER.md")
          text = p.read_text()
          text = text[:text.index("## Approval status")] + "## Approval status\n\nApproved by the user October 27, 2026; source transfer completed. The temporary workflow removed itself and inherited workflows were omitted. See HACKATHON_SOURCE.md for the exact source commit.\n"
          p.write_text(text)
          PY
          test -f "$VERIFY_FILE"
          test ! -d .github/workflows
          git add -f -- README.md HACKATHON_*.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: copy approved pinned source and preserve hackathon plans"
          git push origin HEAD:refs/heads/main
          printf "Source transfer completed; temporary workflow removed.\n"
